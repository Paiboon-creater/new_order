<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCHIVE: JAGUAR // ORDER EXPEDITION</title>
    
    <!-- Google Fonts: ฟอนต์สไตล์ผจญภัย (Cinzel) และ ฟอนต์ไทย (Kanit) -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 สำหรับแจ้งเตือน -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- jQuery & Select2 (สำหรับ Dropdown ที่พิมพ์ค้นหาได้) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <style>
        :root {
            --indy-dark: #1a1108;       /* สีเงาถ้ำมืด */
            --indy-brown: #3e2723;      /* สีหนัง/ไม้เข้ม */
            --indy-leather: #5d4037;    /* สีหนังนิ่ม */
            --indy-gold: #d4af37;       /* สีทองโบราณ (ขุมทรัพย์) */
            --indy-gold-glow: #ffd54f;  /* สีทองสว่าง (แสงคบเพลิง) */
            --indy-paper: #f4ecd8;      /* สีกระดาษเก่า/แผนที่ */
            --indy-paper-dark: #e6d5b8; /* สีกระดาษเก่า (เงา) */
            --indy-danger: #b71c1c;     /* สีแดงเลือด/อันตราย */
            --indy-text: #2e1f14;       /* สีหมึกเข้ม */
            
            --adventure-border: 3px solid var(--indy-brown);
        }

        /* เอฟเฟกต์แสงคบเพลิงในถ้ำ (Torchlight Flicker) */
        @keyframes torchFlicker {
            0% { background: radial-gradient(circle at 50% 20%, #4a3319 0%, #1a1108 50%, #050301 100%); }
            25% { background: radial-gradient(circle at 48% 22%, #52391d 0%, #1a1108 52%, #050301 100%); }
            50% { background: radial-gradient(circle at 52% 18%, #4a3319 0%, #1a1108 48%, #050301 100%); }
            75% { background: radial-gradient(circle at 50% 20%, #5c4122 0%, #1a1108 55%, #050301 100%); }
            100% { background: radial-gradient(circle at 50% 20%, #4a3319 0%, #1a1108 50%, #050301 100%); }
        }

        body {
            background-color: var(--indy-dark);
            animation: torchFlicker 4s infinite alternate;
            color: var(--indy-text);
            font-family: 'Kanit', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* ฝุ่นผงในถ้ำลอยไปมา */
        .dust-particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255,215,100,0.15) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            opacity: 0.4;
            animation: moveDust 20s linear infinite;
        }
        @keyframes moveDust {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(-50px) translateX(50px); }
        }

        .landscape-wrapper {
            width: 98vw; 
            max-width: none;
            margin: 0 auto;
            /* พื้นหลังแบบกระดาษแผนที่เก่า */
            background: var(--indy-paper);
            background-image: linear-gradient(rgba(244, 236, 216, 0.9), rgba(230, 213, 184, 0.9)), url('https://www.transparenttextures.com/patterns/old-wall.png');
            border: 6px double var(--indy-brown);
            box-shadow: inset 0 0 40px rgba(62, 39, 35, 0.5), 0 15px 35px rgba(0,0,0,0.8);
            border-radius: 4px;
            padding: 25px;
            position: relative;
        }

        /* หัวข้อสไตล์อินเดียน่า โจนส์ */
        .indy-header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px dashed var(--indy-leather);
            padding-bottom: 10px;
            position: relative;
        }
        .indy-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
            background: linear-gradient(to bottom, #f2e3c6 0%, #d4af37 50%, #b38b22 100%);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8), 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .indy-header p {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--indy-leather);
            margin-top: 5px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* ฟอร์มและ Input */
        .adventure-panel {
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid var(--indy-leather);
            box-shadow: 4px 4px 10px rgba(0,0,0,0.15);
            padding: 25px 20px;
            margin-bottom: 20px;
            position: relative;
            border-radius: 2px;
        }
        .adventure-panel::before {
            position: absolute;
            top: -14px;
            left: 20px;
            background: var(--indy-brown);
            color: var(--indy-gold);
            font-family: 'Cinzel', serif;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 2px 15px;
            border: 1px solid var(--indy-gold);
            font-size: 0.9rem;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        
        #form-panel::before { content: "EXPEDITION LOG"; }
        .report-panel::before { content: "DISCOVERY ARCHIVES"; }

        label {
            font-weight: 600;
            font-size: 1rem;
            color: var(--indy-brown);
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(93, 64, 55, 0.3);
            display: inline-block;
            padding-bottom: 2px;
        }

        .form-control, .form-select {
            background-color: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--indy-leather);
            border-radius: 0;
            font-weight: 500;
            font-size: 1.05rem;
            color: var(--indy-text);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1), 0 0 8px var(--indy-gold);
            border-color: var(--indy-gold);
            outline: none;
            background-color: #fff;
        }

        /* Select2 Theme ปรับแต่ง */
        .select2-container--default .select2-selection--single {
            background-color: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--indy-leather);
            border-radius: 0;
            height: calc(3.5rem + 2px);
            display: flex;
            align-items: center;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            font-weight: 500; font-size: 1.05rem; color: var(--indy-text);
        }
        .select2-dropdown { 
            border: 2px solid var(--indy-leather); 
            background: var(--indy-paper);
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3); 
        }

        /* ปุ่มกดสไตล์เข็มขัดหนัง / แผ่นป้ายทองแดง */
        .btn-indy {
            font-family: 'Kanit', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid var(--indy-dark);
            border-radius: 3px;
            padding: 12px 20px;
            box-shadow: 2px 2px 0px var(--indy-dark);
            transition: all 0.15s;
            width: 100%;
        }
        .btn-indy:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px var(--indy-dark); }
        
        .btn-submit { 
            background: linear-gradient(to bottom, #5d4037, #3e2723); 
            color: var(--indy-gold); 
        }
        .btn-submit:hover { background: linear-gradient(to bottom, #6d4c41, #4e342e); color: #fff; }
        
        .btn-cancel { 
            background: linear-gradient(to bottom, #b71c1c, #880e4f); 
            color: white; 
            margin-top: 10px; 
            display: none; 
        }

        /* ตารางแนวนอน สไตล์บันทึกเก่า */
        .table-responsive {
            border: 2px solid var(--indy-brown);
            box-shadow: 3px 3px 10px rgba(0,0,0,0.1);
            background: rgba(255, 255, 255, 0.5);
            width: 100%;
            overflow-x: auto;
            display: block;
        }
        .table { margin-bottom: 0; white-space: nowrap; width: 100%; }
        .table thead { background: var(--indy-brown); color: var(--indy-gold); }
        .table th { 
            border-bottom: 2px solid var(--indy-dark) !important; 
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .table th:hover { background-color: var(--indy-leather); color: #fff; }
        .table td { 
            border-bottom: 1px solid rgba(62, 39, 35, 0.2); 
            border-right: 1px solid rgba(62, 39, 35, 0.1);
            padding: 12px 15px;
            vertical-align: middle;
            color: var(--indy-text);
            font-weight: 500;
        }
        .table-striped tbody tr:nth-of-type(odd) { background-color: rgba(0, 0, 0, 0.03); }
        .table tbody tr:hover { background-color: rgba(212, 175, 55, 0.15); }
        
        /* ไอคอนเรียงลำดับ */
        .sort-icon { margin-left: 8px; opacity: 0.3; }
        .sort-active { opacity: 1; color: #fff; }

        .action-btn {
            border: 1px solid var(--indy-brown);
            background: transparent;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 2px;
            transition: 0.2s;
        }
        .btn-edit { color: var(--indy-brown); }
        .btn-edit:hover { background: var(--indy-brown); color: var(--indy-gold); }
        .btn-del { color: var(--indy-danger); border-color: var(--indy-danger); }
        .btn-del:hover { background: var(--indy-danger); color: white; }
        .btn-status { color: #2e7d32; border-color: #2e7d32; }
        .btn-status:hover { background: #2e7d32; color: white; }
        .btn-restore { color: #1565c0; border-color: #1565c0; }
        .btn-restore:hover { background: #1565c0; color: white; }

        /* สไตล์ของ Tab */
        .nav-tabs {
            border-bottom: 2px solid var(--indy-brown);
            margin-bottom: 15px;
        }
        .nav-tabs .nav-link {
            color: var(--indy-leather);
            font-weight: 600;
            border: 2px solid transparent;
            border-bottom: none;
            background: rgba(255, 255, 255, 0.3);
            margin-right: 5px;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
        }
        .nav-tabs .nav-link:hover {
            border-color: var(--indy-leather) var(--indy-leather) transparent;
        }
        .nav-tabs .nav-link.active {
            color: var(--indy-dark);
            background-color: var(--indy-paper);
            border-color: var(--indy-brown) var(--indy-brown) transparent;
            font-weight: bold;
        }

        /* ตั้งค่าพริ๊นต์ A4 แนวนอน */
        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body { background: white; color: black; animation: none; padding: 0; }
            .dust-particles { display: none; }
            .landscape-wrapper { width: 100%; box-shadow: none; border: none; padding: 0; background: white; }
            .adventure-panel { box-shadow: none; border: 1px solid black; }
            .action-btn, #cancelEditBtn, .filter-section, button, .nav-tabs { display: none !important; }
            .table-responsive { overflow: visible; box-shadow: none; border: 1px solid black;}
        }
    </style>
</head>
<body>

<div class="dust-particles"></div>

<div class="landscape-wrapper">
    
    <div class="indy-header">
        <h1>JAGUAR PRODUCTION</h1>
        <p><i class="fa-solid fa-gem text-warning me-2"></i> THE LOST ORDER ARCHIVES <i class="fa-solid fa-gem text-warning ms-2"></i></p>
    </div>

    <div class="row g-4">
        <!-- ฝั่งซ้าย: ฟอร์มสร้าง/แก้ไข -->
        <div class="col-lg-3 col-md-12">
            <div class="adventure-panel h-100" id="form-panel">
                <form id="orderForm" onsubmit="saveOrder(event)">
                    <input type="hidden" id="edit_id_order" value="">

                    <div class="mb-3">
                        <label>เลขที่ใบสั่งผลิต (Order No)</label>
                        <input type="text" id="order_no" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label>เลขที่ใบสั่งซื้อ (PO No)</label>
                        <input type="text" id="po_no" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>รหัสชิ้นงานโบราณ (Work Code)</label>
                        <select id="id_work" class="form-select searchable-dropdown" style="width: 100%;" required>
                            <option value="">-- ค้นหารหัสชิ้นงาน --</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>จำนวนขุมทรัพย์ (Quantity)</label>
                        <input type="number" id="quantity" class="form-control" min="1" required>
                    </div>

                    <div class="mb-3">
                        <label>วันที่เริ่มสำรวจ</label>
                        <input type="date" id="start_date" class="form-control" required>
                    </div>
                    
                    <div class="mb-4">
                        <label>วันที่คาดว่าจะพบ</label>
                        <input type="date" id="end_date" class="form-control" required>
                    </div>

                    <button type="submit" class="btn-indy btn-submit" id="submitBtn">
                        <i class="fa-solid fa-map-location-dot me-2"></i> บันทึกการค้นพบ
                    </button>
                    <button type="button" class="btn-indy btn-cancel" id="cancelEditBtn" onclick="cancelEditMode()">
                        <i class="fa-solid fa-person-running me-2"></i> หลบหนี! (ยกเลิก)
                    </button>
                </form>
            </div>
        </div>

        <!-- ฝั่งขวา: ตารางและตัวกรอง -->
        <div class="col-lg-9 col-md-12">
            <div class="adventure-panel report-panel h-100">
                
                <!-- ระบบ Tab แบ่งสถานะใบสั่ง -->
                <ul class="nav nav-tabs" id="orderTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="active-tab" data-bs-toggle="tab" type="button" role="tab" onclick="switchTab(false)">
                            <i class="fa-solid fa-map"></i> แผนที่ที่กำลังสำรวจ
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="closed-tab" data-bs-toggle="tab" type="button" role="tab" onclick="switchTab(true)">
                            <i class="fa-solid fa-box-archive"></i> บันทึกที่ปิดผนึกแล้ว
                        </button>
                    </li>
                </ul>

                <!-- ส่วนของตัวกรอง -->
                <div class="row filter-section mb-3 align-items-end">
                    <div class="col-md-4 mb-2 mb-md-0">
                        <label><i class="fa-solid fa-magnifying-glass"></i> ค้นหาด้วย PO</label>
                        <select id="filter_po" class="form-select searchable-dropdown" style="width: 100%;" onchange="filterAndSortTable()">
                            <option value="">-- แสดงทุกรายการ --</option>
                        </select>
                    </div>
                    <div class="col-md-5 mb-2 mb-md-0">
                        <label><i class="fa-solid fa-magnifying-glass"></i> ค้นหาด้วยรหัสชิ้นงาน</label>
                        <select id="filter_work" class="form-select searchable-dropdown" style="width: 100%;" onchange="filterAndSortTable()">
                            <option value="">-- แสดงทุกรายการ --</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn-indy btn-submit w-100 py-2" onclick="fetchOrdersReport()">
                            <i class="fa-solid fa-compass fa-spin-hover"></i> สำรวจพื้นที่ใหม่
                        </button>
                    </div>
                </div>

                <!-- ตาราง -->
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th onclick="setSort('order_no')">เลขที่ใบสั่ง <i class="fa-solid fa-sort sort-icon" id="sort_order_no"></i></th>
                                <th onclick="setSort('po_no')">PO <i class="fa-solid fa-sort sort-icon" id="sort_po_no"></i></th>
                                <th onclick="setSort('work_code_name')">รหัสชิ้นงาน <i class="fa-solid fa-sort sort-icon" id="sort_work_code_name"></i></th>
                                <th class="text-end" onclick="setSort('quantity')">จำนวน <i class="fa-solid fa-sort sort-icon" id="sort_quantity"></i></th>
                                <th onclick="setSort('start_date')">เริ่ม <i class="fa-solid fa-sort sort-icon" id="sort_start_date"></i></th>
                                <th onclick="setSort('end_date')">เสร็จ <i class="fa-solid fa-sort sort-icon" id="sort_end_date"></i></th>
                                <th class="text-center" style="min-width: 160px;">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody">
                            <tr><td colspan="7" class="text-center fw-bold fs-5 py-4">กำลังปัดฝุ่นรวบรวมเอกสาร... <i class="fa-solid fa-hourglass-half fa-spin ms-2"></i></td></tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const SUPABASE_URL = "https://siiiifesdjuunwmwozfb.supabase.co/rest/v1";
    const SUPABASE_KEY = "sb_publishable_ohToE8Z_Fzo87uBtzdPDIg_cqHCi3HT";
    const headers = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" };

    let allOrdersData = [];
    let workItemsMap = {};
    
    let currentSortCol = 'order_no';
    let isAscending = true;
    let showingClosedTab = false; // ตัวแปรเก็บสถานะว่าอยู่แท็บไหน (false = แผนที่กำลังสำรวจ, true = ปิดผนึกแล้ว)

    $(document).ready(function() {$('.searchable-dropdown').select2({ theme: "default" });
        document.getElementById('start_date').valueAsDate = new Date();
        document.getElementById('end_date').valueAsDate = new Date();
        initApp();
    });

    async function initApp() {
        await loadWorkItems();
        await fetchOrdersReport();
    }

    async function loadWorkItems() {
        try {
            const res = await fetch(`${SUPABASE_URL}/work_items?select=id_work,work_code&order=work_code.asc`, { headers });
            const workItems = await res.json();
            
            const selectWork = $('#id_work');
            const filterWork = $('#filter_work');
            
            workItems.forEach(w => {
                workItemsMap[w.id_work] = w.work_code;
                let opt1 = new Option(w.work_code, w.id_work, false, false);
                let opt2 = new Option(w.work_code, w.id_work, false, false);
                selectWork.append(opt1);
                filterWork.append(opt2);
            });
            
            selectWork.trigger('change');
            filterWork.trigger('change');
        } catch (error) { console.error(error); }
    }

    async function fetchOrdersReport() {
        try {
            const res = await fetch(`${SUPABASE_URL}/orders?select=*`, { headers });
            allOrdersData = await res.json();
            
            allOrdersData.forEach(order => {
                order.work_code_name = workItemsMap[order.id_work] ? workItemsMap[order.id_work] : order.id_work;
                order.is_closed = order.is_closed || false; // จัดการค่า null ให้เป็น false
            });

            updatePoFilterDropdown();
            filterAndSortTable();
        } catch (error) {
            document.getElementById('reportTableBody').innerHTML = '<tr><td colspan="7" class="text-center text-danger fw-bold fs-5 py-4">แผนที่หายาก! ดึงข้อมูลล้มเหลว</td></tr>';
        }
    }

    function updatePoFilterDropdown() {
        const filterPo = $('#filter_po');
        filterPo.empty().append('<option value="">-- แสดงทุกรายการ --</option>');
        const uniquePoList = [...new Set(allOrdersData.map(item => item.po_no).filter(Boolean))].sort();
        uniquePoList.forEach(po => { filterPo.append(new Option(po, po, false, false)); });
        filterPo.trigger('change');
    }

    function switchTab(isClosedTab) {
        showingClosedTab = isClosedTab;
        filterAndSortTable();
    }

    function setSort(col) {
        if(currentSortCol === col) { isAscending = !isAscending; } 
        else { currentSortCol = col; isAscending = true; }
        filterAndSortTable();
    }

    function filterAndSortTable() {
        const poVal = $('#filter_po').val();
        const workVal = $('#filter_work').val();

        // 1. กรองตามแท็บที่เลือก (is_closed)
        let filtered = allOrdersData.filter(item => item.is_closed === showingClosedTab);

        // 2. กรองตาม PO และ Work Code
        if (poVal) filtered = filtered.filter(item => item.po_no === poVal);
        if (workVal) filtered = filtered.filter(item => String(item.id_work) === String(workVal));

        // 3. เรียงลำดับ
        filtered.sort((a, b) => {
            let valA = a[currentSortCol] || ''; let valB = b[currentSortCol] || '';
            if(currentSortCol === 'quantity') { valA = Number(valA); valB = Number(valB); } 
            else { valA = String(valA).toLowerCase(); valB = String(valB).toLowerCase(); }
            if (valA < valB) return isAscending ? -1 : 1;
            if (valA > valB) return isAscending ? 1 : -1;
            return 0;
        });

        renderTable(filtered);
        updateSortIcons();
    }

    function updateSortIcons() {
        $('.sort-icon').removeClass('fa-sort-up fa-sort-down sort-active').addClass('fa-sort');
        const iconId = `#sort_${currentSortCol}`;
        $(iconId).removeClass('fa-sort').addClass(isAscending ? 'fa-sort-up sort-active' : 'fa-sort-down sort-active');
    }

    function renderTable(data) {
        const tbody = document.getElementById('reportTableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted fw-bold py-4">
                ${showingClosedTab ? 'ยังไม่มีบันทึกที่ถูกปิดผนึก...' : 'ไม่พบร่องรอยในบันทึก...'}
            </td></tr>`;
            return;
        }

        data.forEach(order => {
            let tr = document.createElement('tr');
            
            // สลับปุ่มตามสถานะของแท็บ
            let statusBtn = showingClosedTab 
                ? `<button class="action-btn btn-restore me-1" onclick="verifyPinAndToggleStatus(${order.id_order}, false)" title="รื้อฟื้นกลับมาทำต่อ"><i class="fa-solid fa-arrow-rotate-left"></i></button>`
                : `<button class="action-btn btn-status me-1" onclick="verifyPinAndToggleStatus(${order.id_order}, true)" title="ปิดผนึกเอกสาร (เสร็จสิ้น)"><i class="fa-solid fa-box-archive"></i></button>`;

            // ปุ่มแก้ไขและลบ จะแสดงเฉพาะแท็บที่กำลังทำงาน (แก้ไขให้แสดงตามความเหมาะสมได้)
            let editDelBtns = showingClosedTab 
                ? `<button class="action-btn btn-del" onclick="verifyPinAndDelete(${order.id_order})" title="ทำลายทิ้ง"><i class="fa-solid fa-skull-crossbones"></i></button>`
                : `<button class="action-btn btn-edit me-1" onclick="verifyPinAndEdit(${order.id_order})" title="บูรณะข้อมูล"><i class="fa-solid fa-hammer"></i></button>
                   <button class="action-btn btn-del" onclick="verifyPinAndDelete(${order.id_order})" title="ทำลายทิ้ง"><i class="fa-solid fa-skull-crossbones"></i></button>`;

            tr.innerHTML = `
                <td class="fw-bold" style="color: #6d4c41;">${order.order_no || '-'}</td>
                <td>${order.po_no || '-'}</td>
                <td class="fw-bold">${order.work_code_name}</td>
                <td class="text-end fw-bold fs-5" style="color: #b71c1c;">${order.quantity ? parseInt(order.quantity).toLocaleString() : 0}</td>
                <td>${order.start_date || '-'}</td>
                <td>${order.end_date || '-'}</td>
                <td class="text-center">
                    ${statusBtn}
                    ${editDelBtns}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // แจ้งเตือนสไตล์สมุดบันทึกนักสำรวจ
    const indyAlert = Swal.mixin({
        background: '#f4ecd8',
        color: '#2e1f14',
        customClass: {
            title: 'jojo-swal-title',
            confirmButton: 'btn-indy btn-submit px-4 py-2 mx-1',
            cancelButton: 'btn-indy btn-cancel px-4 py-2 mx-1',
            input: 'form-control'
        },
        buttonsStyling: false
    });

    // ฟังก์ชันสำหรับสลับสถานะ ปิดงาน/รื้อฟื้นงาน
    async function verifyPinAndToggleStatus(id_order, targetStatus) {
        const actionTitle = targetStatus ? '<i class="fa-solid fa-box-archive" style="color:#2e7d32;"></i> ปิดผนึกเอกสาร' : '<i class="fa-solid fa-arrow-rotate-left" style="color:#1565c0;"></i> รื้อฟื้นภารกิจ';
        const actionText = targetStatus ? 'ต้องการย้ายใบสั่งนี้ไปที่ "บันทึกที่ปิดผนึกแล้ว" ใช่หรือไม่?' : 'ต้องการนำใบสั่งนี้กลับมาแก้ไขใน "แผนที่ที่กำลังสำรวจ" ใช่หรือไม่?';

        const { value: pin } = await indyAlert.fire({
            title: actionTitle,
            html: `${actionText}<br><br><small style="color:var(--indy-danger);">กรอกรหัสผ่าน (paiboon)</small>`,
            input: 'password',
            showCancelButton: true,
            confirmButtonText: 'ยืนยัน',
            cancelButtonText: 'ยกเลิก'
        });

        if (pin === 'paiboon') {
            try {
                // ส่งค่า is_closed ไปอัปเดตที่ Supabase
                const res = await fetch(`${SUPABASE_URL}/orders?id_order=eq.${id_order}`, { 
                    method: 'PATCH', 
                    headers: headers, 
                    body: JSON.stringify({ is_closed: targetStatus }) 
                });

                if (!res.ok) throw new Error('Failed');

                indyAlert.fire('สำเร็จ!', targetStatus ? 'ปิดผนึกเรียบร้อย' : 'รื้อฟื้นกลับมาแล้ว', 'success');
                await fetchOrdersReport();
            } catch (error) {
                indyAlert.fire('ล้มเหลว!', 'เกิดข้อผิดพลาดในการเปลี่ยนสถานะ', 'error');
            }
        } else if (pin !== undefined) {
            indyAlert.fire('รหัสผิดพลาด!', 'คุณไม่ใช่เจ้าของบันทึกนี้!', 'error');
        }
    }

    // (ส่วนแก้ไขข้อมูล ซ่อนการทำงานหากไม่ได้เปิดแท็บ active ก็ทำได้ แต่ปัจจุบันทำงานเหมือนเดิม)
    async function verifyPinAndEdit(id_order) {
        const { value: pin } = await indyAlert.fire({
            title: '<i class="fa-solid fa-key" style="color:#d4af37;"></i> กุญแจลับนักสำรวจ',
            text: 'กรอกรหัสผ่านเพื่อปัดฝุ่นแก้ไขบันทึก (112233)',
            input: 'password',
            showCancelButton: true,
            confirmButtonText: 'ปลดล็อค',
            cancelButtonText: 'ถอยกลับ'
        });

        if (pin === '112233') {
            const orderObj = allOrdersData.find(o => o.id_order === id_order);
            if (orderObj) {
                document.getElementById('edit_id_order').value = orderObj.id_order;
                document.getElementById('order_no').value = orderObj.order_no || '';
                document.getElementById('po_no').value = orderObj.po_no || '';
                $('#id_work').val(orderObj.id_work).trigger('change'); 
                document.getElementById('quantity').value = orderObj.quantity || '';
                document.getElementById('start_date').value = orderObj.start_date || '';
                document.getElementById('end_date').value = orderObj.end_date || '';

                document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-hammer me-2"></i> บูรณะวัตถุโบราณ (อัปเดต)';
                document.getElementById('submitBtn').style.background = 'linear-gradient(to bottom, #d4af37, #b38b22)';
                document.getElementById('submitBtn').style.color = '#1a1108';
                document.getElementById('cancelEditBtn').style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        } else if (pin !== undefined) {
            indyAlert.fire('รหัสผิดพลาด!', 'คุณไม่ใช่สมาชิกของสมาคมโบราณคดี!', 'error');
        }
    }

    function cancelEditMode() {
        document.getElementById('orderForm').reset();
        document.getElementById('edit_id_order').value = '';
        $('#id_work').val('').trigger('change');
        document.getElementById('start_date').valueAsDate = new Date();
        document.getElementById('end_date').valueAsDate = new Date();

        document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-map-location-dot me-2"></i> บันทึกการค้นพบ';
        document.getElementById('submitBtn').style.background = 'linear-gradient(to bottom, #5d4037, #3e2723)';
        document.getElementById('submitBtn').style.color = '#d4af37';
        document.getElementById('cancelEditBtn').style.display = 'none';
    }

    async function verifyPinAndDelete(id_order) {
        const { value: pin } = await indyAlert.fire({
            title: '<i class="fa-solid fa-skull" style="color:#b71c1c;"></i> หลุมพรางอันตราย!',
            text: 'ต้องการทำลายเอกสารนี้ใช่หรือไม่? กรอกรหัสยืนยัน (112233)',
            input: 'password',
            showCancelButton: true,
            confirmButtonText: 'ทำลายทิ้ง',
            cancelButtonText: 'หนีเอาตัวรอด'
        });

        if (pin === '112233') {
            try {
                await fetch(`${SUPABASE_URL}/orders?id_order=eq.${id_order}`, { method: 'DELETE', headers: headers });
                indyAlert.fire('ถูกทำลาย!', 'หลักฐานถูกฝังกลบเรียบร้อยแล้ว', 'success');
                await fetchOrdersReport();
            } catch (error) {
                indyAlert.fire('ล้มเหลว!', 'กับดักทำงาน! ลบข้อมูลไม่สำเร็จ', 'error');
            }
        } else if (pin !== undefined) {
            indyAlert.fire('รหัสผิดพลาด!', 'กุญแจไม่ตรงกับแม่กุญแจโบราณ', 'error');
        }
    }

    async function saveOrder(e) {
        e.preventDefault();
        const editId = document.getElementById('edit_id_order').value;
        const submitBtn = document.getElementById('submitBtn');
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-person-digging fa-fade me-2"></i> กำลังขุดค้น...';

        const payload = {
            order_no: document.getElementById('order_no').value.trim(),
            po_no: document.getElementById('po_no').value.trim(),
            id_work: parseInt($('#id_work').val()),
            quantity: parseInt(document.getElementById('quantity').value),
            start_date: document.getElementById('start_date').value,
            end_date: document.getElementById('end_date').value,
            // เพิ่ม is_closed กลับไปเป็น false เสมอเมื่อมีการสร้างใหม่หรืออัปเดตจากฟอร์มหลัก
            is_closed: false 
        };

        try {
            let res;
            if (editId) {
                res = await fetch(`${SUPABASE_URL}/orders?id_order=eq.${editId}`, { method: 'PATCH', headers: headers, body: JSON.stringify(payload) });
            } else {
                res = await fetch(`${SUPABASE_URL}/orders`, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
            }

            if (!res.ok) throw new Error('Failed');

            indyAlert.fire('การค้นพบสำเร็จ!', 'ข้อมูลของสะสมชิ้นนี้สมควรไปอยู่ในพิพิธภัณฑ์!', 'success');
            cancelEditMode();
            
            // กลับมาที่แท็บหลักเมื่อสร้างใหม่
            switchTab(false); 
            // อัปเดต UI กลับเป็นแท็บแรกด้วย
            document.getElementById('active-tab').classList.add('active');
            document.getElementById('closed-tab').classList.remove('active');
            
            await fetchOrdersReport();

        } catch (error) {
            indyAlert.fire('ล้มเหลว!', 'ศิลาจารึกอ่านไม่ออก บันทึกข้อมูลไม่สำเร็จ', 'error');
        } finally {
            submitBtn.disabled = false;
            if(editId) {
                submitBtn.innerHTML = '<i class="fa-solid fa-hammer me-2"></i> บูรณะวัตถุโบราณ (อัปเดต)';
            } else {
                submitBtn.innerHTML = '<i class="fa-solid fa-map-location-dot me-2"></i> บันทึกการค้นพบ';
            }
        }
    }
</script>

</body>
